name: Auto update

on:
  schedule:
    - cron: '37 19 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Install packages
        run: |
          sudo apt-get install openssh-client python3-setuptools

      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v6
        with:
          repository: JinnLynn/genpac
          path: genpac

      - uses: actions/checkout@v6
        with:
          repository: gfwlist/gfwlist
          path: gfwlist

      - uses: petronny/git-config-user@master
        with:
          path: .

      # Pin the interpreter: genpac declares support for 3.8-3.12, and its
      # pinned PyYAML 6.0.1 has no wheels for newer versions (3.13+), which
      # makes pip fall back to a fragile source build.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Install into an isolated venv instead of the system site-packages.
      # `sudo pip3 install .` used to try replacing the apt-managed PyYAML
      # (6.0.3) with 6.0.1 and died with:
      #   error: uninstall-no-record-file
      #   Cannot uninstall PyYAML 6.0.3 ... no RECORD file was found for PyYAML
      - name: Install genpac
        run: |
          cd genpac
          # sed 's/from collections import Callable/from collections.abc import Callable/g' -i $(grep 'from collections import Callable' . -rIl)
          python3 -m venv "${RUNNER_TEMP}/genpac-venv"
          "${RUNNER_TEMP}/genpac-venv/bin/python" -m pip install --upgrade pip setuptools wheel
          "${RUNNER_TEMP}/genpac-venv/bin/python" -m pip install --no-cache-dir .
          echo "${RUNNER_TEMP}/genpac-venv/bin" >> "${GITHUB_PATH}"

      - name: Update
        run: |
          set -x

          
          pac_proxy=""
          if [ "${{ secrets.SOCKS_PROXY }}" != '' ]; then 
            pac_proxy="SOCKS5 ${{ secrets.SOCKS_PROXY }};"
          fi
          if [ "${{ secrets.HTTP_PROXY}}" != '' ];then
            pac_proxy=${pac_proxy}"HTTP ${{ secrets.HTTP_PROXY}};"
          fi
          pac_proxy=${pac_proxy}"DIRECT"
          genpac --format=pac --pac-proxy="${pac_proxy}" --gfwlist-local=gfwlist/gfwlist.txt  -o gfwlist.pac
          sed '1,7d' -i gfwlist.pac

          git add gfwlist.pac
          git commit -m "[$(LANG=C date)] auto update" || exit 0

          [ -n "${{ secrets.READ_ONLY }}" ] && git show && exit 0

          git push origin master
